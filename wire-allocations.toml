# TrustIr wire-allocation registry.
#
# Three namespaces on this wire are linear counters: the binary format
# version, the tag byte of each wire enum, and the version of each
# `trust_ir.*.vN` digest domain / schema tag. Every number in use has a row.
#
# ADDING A NUMBER. Add the row in the same commit as the code that uses it:
#
#   python3 scripts/wire_alloc.py reserve version --feature <name> \
#          --constant <NAME>_FORMAT_VERSION --owner <lane>
#   (or `reserve tag --enum Ty --variant Foo --since <N> --owner <lane>`, or
#    `reserve domain --domain trust_ir.x.y --binds "<what it binds>" --owner <lane>`)
#
# then set the row's status to "landed" (for a version, "shipped" in
# crates/trust-ir/wire_versions.tsv, which `reserve version` also writes).
# Rows are one per line and sorted, so if main took the same number first the
# merge conflicts on adjacent lines: renumber yours (`wire_alloc.py next`
# prints the next free number). Claims in different namespaces merge cleanly.
# Never union-merge this file (a test pins its merge attribute).
#
# WIRE VERSIONS LAND IN NUMBER ORDER. Read gates are cumulative
# (`version >= N`), so a blob numbered N + 1 claims everything N carries, and
# the census refuses a landed version above an open reserved one. If open
# reservations sit below the number you need, take the lowest open one:
#
#      python3 scripts/wire_alloc.py takeover --feature <your feature>
#
# Every reservation you pass moves up by one and keeps its row; the displaced
# line sees the renumber from the census the next time it merges main.
# ABANDONING a reserved number: delete the row while it is the highest, or let
# it be taken over. Never mark a number "burned" that never landed: the census
# then demands the reader REFUSE it, a permanent hole in the accepted range.
# "burned" is for numbers whose blobs exist (rows 26-28).
#
# An `owner` whose branch was deleted names nothing: gate 0's owners audit
# (`wire_alloc.py owners`) fails on it, and `wire_alloc.py pin <lane>` pins the
# lane's open claims to the commits that landed them, owner = "<lane>@<commit>"
# (the same string in both wire-version ledgers). Or release the claim. A lane
# that never pushes its branch (it commits straight to main) names nothing
# outside its own clone either: once its claim is on origin's main the audit
# fails in every other clone (UNPINNED ON MAIN) until the lane is pinned.
#
# THIS FILE IS LOAD-BEARING. `trust-ir`'s `binary::wire_census` tests
# re-derive the claims below from the code. These are EXECUTED TESTS and
# SOURCE SCANS on a lane that makes no proof claim, and each has an edge:
#
#   * every `VERSION` / `*_FORMAT_VERSION` constant in binary.rs has a landed
#     row, and every row's status is what the reader does (each header is fed
#     to the real `deserialize_module`);
#   * every tag byte of every REGISTERED tag space is observed by running the
#     real writer, and must have a row. Which enums ARE tag spaces is a
#     hand-kept list in the census, so binary.rs is also SCANNED for every
#     enum it matches to or from a literal tag byte (`tag_enum!` heads, the
#     `InvalidTag` refusal arm of every closed tag match, and writer arms), and
#     one that is not registered fails. It cannot see a tag a writer COMPUTES
#     instead of spelling, read by a match with no refusal arm;
#   * every VERSIONED IDENTITY string literal in non-test sources under
#     crates/*/src and frontend/src — a name ending `.vN` or `-vN`, however it
#     is prefixed, a bare version-suffixed `concat!` fragment included — has a
#     row or sits under a `scan_exempt` namespace another repository
#     allocates. It cannot see a name whose version is not at the END, or one
#     assembled at run time from pieces that do not themselves end in one.
#
# `scripts/wire_alloc.py check` repeats the source scans with no compiler, and
# refuses a binary.rs that no longer declares `mod wire_census;` — without
# which the compiled half silently runs zero tests.
#
# The `wire_version` table is bound to `crates/trust-ir/wire_versions.tsv`:
# both halves of the gate refuse any number the two files tell differently (a
# row in only one, a status told two ways, or an open number with a different
# owner or constant). `reserve version` and `takeover` write both files;
# `wire_alloc.py sync` copies a row somebody added to only one.
#
# GRAMMAR: a strict subset of TOML. Each namespace is one array of tables,
# spelled as ONE inline table PER LINE (so two claims to one number are a
# textual conflict). Integers and escape-free strings only.
#
# wire_version   number    gap-free from 1; the next free one is max + 1
#                status    retired  = once written, now below the read floor
#                          burned   = refused on read forever (a collision)
#                          landed   = the module reader accepts this header
#                          reserved = allocated, no code yet
#                constant  the named constant in crates/trust-ir/src/binary.rs
#                date      commit date the FEATURE first carried this number in
#                          main's history (from `git log` over binary.rs)
# enum_tag       rows of one enum are contiguous, tags strictly increasing;
#                the next free tag of an enum is its max + 1. `since` is the
#                lowest READABLE wire version whose blobs can carry the tag
#                (23 = at or before the v23 read floor). A variant written as
#                `(none)` is the absent spelling that shares the tag byte;
#                `Variant.qualifier` is a second wire spelling of one variant.
# digest_domain  sorted by (domain, version); the string in the sources is
#                `<domain>.v<version>`, or `<domain>-v<version>` when the row
#                carries `sep = "-"`. burned = never spell it again.
#                `trust_ir.test.*` is the unallocated scratch space for tests.
#                A NEW name is spelled `trust_ir.<dotted.name>`. The
#                `trust-ir.*` / `-vN` rows are spellings that already exist and
#                whose counters must be locked too; nobody mints another (a
#                reserved row in a legacy spelling is refused unless it bumps
#                an existing name).
# owner          every namespace: the lane holding the claim, a label with no
#                space and no `@` (a branch, a roadmap increment), or that
#                label pinned, `<lane>@<commit>` (7-40 lowercase hex). `check`
#                requires a pin to be the commit in HEAD's history that
#                introduced the claim's row; in an exported snapshot (no
#                development history) it checks the form only, and says so.
# scan_exempt    what a completeness scan may ignore, and WHY; sorted by
#                (scan, name). `literal`: a NAMESPACE PREFIX (ends `.`, `-` or
#                `:`) another repository allocates — never one overlapping
#                `trust_ir.` / `trust-ir.`. `tag-space`: an enum a closed tag
#                match names that is not a wire enum. A row that exempts
#                nothing is refused, so the table stays as small as the truth.

