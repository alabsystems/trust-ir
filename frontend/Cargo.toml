# trust-ir-frontend — M1: automated THIR -> trust-ir lowering.
#
# A standalone `rustc_private` crate (sibling-style to
# ~/trust-cg/crates/rustc-codegen-trust-cg, but a thin DRIVER not a codegen
# backend) that reads `tcx.thir_body(def)` for a target fn and lowers a
# single-match-over-enum bool-returning function into a `trust_ir::Function`
# via the trust_ir_build ModuleBuilder/FunctionBuilder API.
#
# Build and test it with the Trust toolchain (owner directive 2026-09-28):
#   targo --unverified build --manifest-path frontend/Cargo.toml --locked
#   targo --unverified test  --manifest-path frontend/Cargo.toml --locked
# The installed Trust sysroot resolves `rustc_private` directly (no -L overlay, no
# private-sysroot copy), and build.rs bakes an rpath to its `librustc_driver`, so
# `target/*/trust_ir_mir` runs without DYLD_LIBRARY_PATH/LD_LIBRARY_PATH. At run
# time the drivers take RUSTC (default `trustc`) as the ABI-matching compiler.
# The x.py stage0-cargo/stage1-rustc recipe this block used to give is retired;
# it is in git history (bf7ee706:frontend/Cargo.toml).
#
# Author: M1 frontend (THIR -> trust-ir lowering)
# License: Apache-2.0
[package]
name = "trust_ir_frontend"
version = "0.1.0"
edition = "2021"
publish = false

# A rustc_private driver binary: links rustc internals like rustc-codegen-trust-cg,
# but invoked as `trust_ir_frontend <file.rs>` rather than loaded by rustc.
[[bin]]
name = "trust_ir_frontend"
path = "src/main.rs"

# A SECOND driver binary: the STAGE1-HOSTED MIR -> trust-ir whole-program path.
# Unlike trust_ir_frontend (which hooks after_expansion for THIR), this hooks
# after_analysis(tcx) — where MIR is already built and available — and uses the
# monomorphization collector (collect_and_partition_mono_items) to enumerate
# EVERY MonoItem::Fn of the crate, getting each one's MIR `Body` via
# tcx.instance_mir(instance.def). Additive: shares the trust_ir_frontend lib but
# does not touch the THIR modes.
[[bin]]
name = "trust_ir_mir"
path = "src/mir_driver.rs"

# A library so the pure THIR->trust-ir lowering core and the differential
# harness can be unit-tested without a full rustc invocation.
#
# doctest = false: this crate has no doctests, and a rustdoc run over a
# rustc_private crate needs a rustdoc paired with the same compiler. If doctests
# are ever added, `trustdoc` from the same toolchain is that rustdoc.
#
# VERIFICATION. `targo --unverified` above makes no proof claim. The verified
# lane over this crate is `targo trust check --allow-l0-gaps --manifest-path
# frontend/Cargo.toml` (advisory: every obligation reported, unproved ones
# warn). Measured 2026-09-28 on trustc 321aaeda7, before and after the
# migration: it ICEs compiling the `trust_ir_mir` bin (`RawList<(), GenericArg>
# as Sized` has escaping bound vars, rustc_middle/src/ty/predicate.rs:492),
# with the other units reporting 164 proved / 94 failed / 976 unknown of 1252
# obligations — a compiler bug to fix in Trust, not a reason to reach for
# `-Ztrust-verify=off` here.
#
# The intended test lane is `targo trust test --allow-l0-gaps --manifest-path
# frontend/Cargo.toml --locked`, replacing the `--unverified` recipe above.
# On the installed pack (trustc 321aaeda7) at least THREE refusals stand in
# front of it, and the Trust fix for the ICE clears only the first:
#   1. the `trust_ir_mir` ICE above;
#   2. Trust blocker B5, build scripts. `targo trust test` takes no custom
#      build unit as evidence (Trust `reject_certified_monitor_custom_build_unit`,
#      src/tools/targo/src/cargo/core/compiler/mod.rs), and every build script
#      of the unit graph counts: this crate's build.rs (the rpath), trust-ir's,
#      and the dependencies'. `targo metadata --locked --offline` over this
#      manifest lists 23 build-script packages (normal and build edges on
#      every platform, so a superset; 2026-10-01), so deleting this crate's
#      own build.rs would not clear it. On the installed pack BOTH lanes
#      refuse, `--allow-l0-gaps` included: "evidence-grade certified-monitor
#      tests reject custom build unit <unit>::build-script-build: arbitrary
#      build-script processes and background side effects are not an
#      authenticated compilation/execution TCB". Measured 2026-10-01 on a
#      one-crate probe with a build.rs (exit 2), not on this crate;
#   3. proc macros. `targo trust test` refuses a unit that loads an unaudited
#      in-process proc macro (Trust `reject_in_process_proc_macro_tcb`, same
#      file), and the graph has 4 proc-macro packages (serde_derive,
#      thiserror-impl, bincode_derive, zerocopy-derive; same metadata
#      reading). On the installed pack BOTH lanes refuse: "verified Targo
#      refuses unit <unit>: in-process proc-macro dependencies [<macro>] ...
#      Evidence-grade verification currently enforces a no-proc-macro TCB
#      boundary". Measured 2026-10-01 on a one-crate probe with one local
#      proc-macro dependency and no build script (exit 2 in each lane), not on
#      this crate.
# A pack that includes Trust ce2f898285 (2026-09-22; on Trust main, not in
# 321aaeda7) refuses 2 and 3 only in the strict lane. The advisory lane
# forfeits the evidence instead ("advisory lane: certified-monitor execution
# TCB seals are forfeited for root unit ...; test execution evidence in this
# session is not evidence-grade", and "unit <unit> forfeits proof authority:
# in-process proc-macro dependencies [...]"), the first for every advisory
# test run, build scripts or not. Read from that commit's code, not run: no
# such pack is installed here.
# That the lane runs once these clear is NOT measured: in the shell that took
# the measurements above, the installed pack's advisory test lane refused even
# a dependency-free crate ("missing its authenticated
# `DYLD_FALLBACK_LIBRARY_PATH` runtime-library closure"; not investigated).
# And the advisory lane's test execution is never evidence-grade: only the
# strict lane's can be, and that needs AT LEAST B5 itself (contained, sealed
# build scripts), Trust D21/PM-1 for the 4 proc macros, and an admission rule
# for the graph's native link closure, which B5's design leaves out of scope.
# The strict lane refuses that closure today
# (`reject_certified_monitor_dynamic_rust_linkage_with_audited_proc_macro`):
# this crate's own `-C link-arg` (the rpath build.rs prints), and the native
# `-l` / `-L native=` that zstd-sys and psm emit. Read from Trust main's code
# (1ec945d698), not run; the list is not shown to be complete.
# Evidence class: prose-only. No gate runs either verified lane over this
# crate.
[lib]
name = "trust_ir_frontend"
path = "src/lib.rs"
doctest = false

[dependencies]
# The local trust-ir crate by PATH (per the task), with the features the
# builder + interpreter + validator need.
trust-ir = { path = "../crates/trust-ir", features = ["serde", "parser", "binary"] }
trust-ir-build = { path = "../crates/trust-ir-build" }

[package.metadata.rust-analyzer]
rustc_private = true

# Keep this crate OUT of any cargo workspace: it links rustc internals from the
# Trust sysroot; that concern must not leak into the main workspace.
[workspace]
