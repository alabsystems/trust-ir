# trust-ir-ay lint policy (gate 0, `workspace-clippy`: `tippy ... -- -D warnings`).
#
# r11 item 5: every ay `Solver` method below PANICS on a module-derived sort
# or width (`bvadd` is literally `try_bvadd(..).unwrap_or_else(|e| panic!(..))`
# at the pinned ay rev), and each has a total `try_*` twin. The adapter calls
# the twins; a new call to a panicking method fails gate 0. The rule is
# type-resolved (clippy resolves `ay::Solver::<method>`, and an unresolvable
# entry is itself a warning, so a typo cannot silently disable it).
#
# Rank: a gate-0 LINT, below type-level. Production code cannot allow it:
# `src/lib.rs` opens with
# `#![cfg_attr(not(test), forbid(clippy::disallowed_methods))]`, so a
# production `#[allow(clippy::disallowed_methods)]` is E0453 under the linter
# (plain rustc does not see it; gate 0's tippy is the enforcement). Since the
# pin carrying ay's `try_render_term_canonical` and `try_term_sort`, every
# panicking method the adapter needs has a twin. `sort_of` and `get_sort` are
# listed because they are `term_sort` under other names. Test targets allow
# the lint crate- or module-wide: they drive ay directly and a panic there is
# a test failure.
#
# `model` is listed for the adapter's one-site rule (item 4): a SAT witness is
# taken only through `vc::sat_witness`, from ay's consumer-accepted
# `try_get_model_for_consumer`, never from the unvalidated `model()`.
