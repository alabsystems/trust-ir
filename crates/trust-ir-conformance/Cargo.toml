# trust-ir-conformance — Serialization conformance corpus
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: Apache-2.0
#
# This crate is primarily tests. Its purpose is to exercise every
# `trust-ir::ty::Ty`, `trust-ir::inst::Inst`, and `trust-ir::proof::ProofAnnotation`
# variant through all four serialization formats (binary, canonical text,
# serde-JSON, serde-MessagePack) and compare the output byte-for-byte
# against checked-in golden files. Downstream consumers (tRust, TrustCg,
# ty, ay) pin these fixtures to guarantee wire-format compatibility
# across TrustIr releases.
#
# The one LIBRARY surface is `src/subset.rs` — the machine-readable
# lowering-target conformance subset (lowering-target-subset.md, repo root) and
# its checker, `subset::module_subset_violations`. Producers self-gating
# their emission (Clean's emit_trust_ir; see the spec doc's "Producer
# notes") depend on this crate with `default-features = false`: the lib
# target needs no features — the defaults exist only for the test corpus.

[package]
name = "trust-ir-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Serialization conformance corpus and lowering-target subset checker for TrustIr"
publish = false

[lib]
# Library surface = the `subset` module (machine-readable lowering-target
# subset + checker, feature-free); everything else lives in the
# integration test targets.
path = "src/lib.rs"

[features]
# Default on to make `cargo test -p trust-ir-conformance` work out of the
# box; this crate exists *to* run the all-formats corpus.
default = ["all"]
all = [
    "trust-ir/parser",
    "trust-ir/binary",
    "trust-ir/fmt",
    "trust-ir/serde",
    "trust-ir/dialect-verif-example",
    "trust-ir/clean-expr",
    "trust-ir-build/serde",
]

[dependencies]
trust-ir = { path = "../trust-ir" }
trust-ir-build = { path = "../trust-ir-build" }

[dev-dependencies]
serde_json = "1.0"
rmp-serde = "1.3"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
