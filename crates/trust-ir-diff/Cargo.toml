# trust-ir-diff — Semantic module diff CLI for TrustIr
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: Apache-2.0
#
# Thin CLI wrapper around `trust-ir::diff` (crates/trust-ir, `diff` feature).
# Reads two TrustIr modules from disk in any of the four formats (binary,
# text, serde JSON, serde MessagePack; resolved by
# `trust_ir::codec::resolve_module_format`, `--format` overrides) and prints
# either a unified-diff text report or a machine-readable JSON report.
#
# Exit codes mirror `Diff::exit_code`:
#   0 — isomorphic
#   1 — differences found
#   2 — parse / I/O / validate error

[package]
name = "trust-ir-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Semantic module diff CLI for TrustIr (ignores ID renumbering and declaration order)"

[[bin]]
name = "trust-ir-diff"
path = "src/main.rs"
# No unit tests in the binary: skip building an empty test harness for it.
test = false

[dependencies]
trust-ir = { path = "../trust-ir", features = ["diff", "serde", "parser", "binary"] }
serde_json = "1.0"
rmp-serde = "1.3"

[dev-dependencies]
# The format tests (tests/formats.rs) write each fixture's text form through
# the loss-checked encoder, `trust_ir::format::text_checked`.
trust-ir = { path = "../trust-ir", features = ["fmt"] }
