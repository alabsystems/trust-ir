# TrustIr - Trusted Mid-level Intermediate Representation
# Universal proof-carrying IR for the t* verified compilation stack
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: Apache-2.0

[workspace]
resolver = "2"
# trust-ir-ay is intentionally NOT a default member: it is the only crate that
# pulls an external (git) dependency (ay), so the default `targo --unverified
# build`/`test` graph stays offline-capable and matches the "zero required
# deps" core contract. Build/test it explicitly with `-p trust-ir-ay` or
# `--workspace`. Nor are the two benchmark generators: they have no tests and
# nothing depends on them; `--workspace` (gate 0's tippy) still checks them.
default-members = [
    "crates/trust-ir",
    "crates/trust-ir-build",
    "crates/trust-ir-cli",
    "crates/trust-ir-conformance",
    "crates/trust-ir-contract",
    "crates/trust-ir-diff",
    "crates/trust-ir-fmt",
    "crates/trust-ir-giveback",
    "crates/trust-ir-laws",
]
members = [
    "crates/trust-ir",
    "crates/trust-ir-build",
    "crates/trust-ir-cli",
    "crates/trust-ir-conformance",
    "crates/trust-ir-contract",
    "crates/trust-ir-diff",
    "crates/trust-ir-fmt",
    "crates/trust-ir-giveback",
    "crates/trust-ir-laws",
    "crates/trust-ir-ay",
    "benchmarks/supremacy-fixture",
    "benchmarks/raft-fixture",
]
exclude = ["frontend"]

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/alabsystems/trust-ir"
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]

[workspace.dependencies]
trust-ir = { path = "crates/trust-ir" }
# The pure decision tables whose laws are PROVED Trust contracts (leaf: depends
# on trust-ir only; verified by scripts/verified_contracts.py, gate 13).
trust-ir-laws = { path = "crates/trust-ir-laws" }
rayon = "1.8"
clap = { version = "4.5", features = ["derive"] }

# The clean-* crates are declared as GIT dependencies (pinned rev) inside the
# member manifests so that trust-ir / trust-ir-build stay consumable as plain
# cargo git dependencies (a `../../../clean/...` path dep escapes the git
# checkout and breaks every git consumer).
#
# THERE IS DELIBERATELY NO `[patch."https://github.com/alabsystems/clean.git"]`
# HERE. Until 2026-08-19 this workspace redirected that URL to the sibling
# `../clean` working tree. Cargo ignores `[patch]` in any manifest that is not
# the workspace root being built, so the redirect NEVER affected a consumer of
# trust-ir — it was a local-development affordance only. Its cost, however, was
# global:
#
#   * `cargo metadata` recorded these crates as PATH packages, so the root
#     Cargo.lock stopped recording the Clean revision at all (a Clean move
#     produced a byte-identical lock — see dependency_pin_coherence.rs, which
#     had to exist precisely because `--locked` could not catch it), and the
#     lock became a property of whatever `../clean` happened to be checked out
#     at rather than of this commit.
#   * `ty-mcc-drift-guard` proves a path-patched exact declaration by requiring
#     `HEAD(../clean) == the declared rev`. That turned "Clean moved" into
#     "trust-ir MUST commit a new declared rev", while Clean itself pins
#     trust-ir (clean-reflect is a non-optional consumer). The two forcing
#     edges formed an unsatisfiable hash cycle: the Clean commit everyone pins
#     had to name the trust-ir commit that named it. Deleting this patch cuts
#     the only removable edge of that cycle and costs nothing a consumer can
#     observe.
#
# ty performed the identical migration on 2026-08-02 (see AUDITED_CLEAN_REV in
# ty's crates/tla-petri/src/mcc_ay_pin.rs). To develop trust-ir against a live
# local Clean tree, use an UNCOMMITTED override — `[patch]` in a gitignored
# `.cargo/config.toml`, or `paths = ["../clean"]` — so the affordance stays in
# the developer's environment instead of in the committed dependency graph.

# Line tables keep panic backtraces readable. Full DWARF made every test
# binary (each statically links trust-ir-build and the Clean stack) up to
# 1.5 GB, a 27 GB debug tree on Linux; dependencies carry none.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# AY's strict Bool/BV authority has a production wall-clock envelope around
# proof construction and independent replay.  Building the solver stack at
# opt-level 0 makes a small 32-bit associativity proof consume that envelope
# deterministically, even though the same proof completes in ~200 ms in an
# optimized build.  Keep TrustIR itself fast to iterate on, but compile the
# external solver hot path the way it is deployed.  This mirrors TrustVC's
# existing dev-profile policy and does not relax any proof or resource limit.
[profile.dev.package.ay-core]
opt-level = 3
[profile.dev.package.ay-dpll]
opt-level = 3
[profile.dev.package.ay-frontend]
opt-level = 3
[profile.dev.package.ay-proof]
opt-level = 3
[profile.dev.package.ay-sat]
opt-level = 3
[profile.dev.package.ay-sys]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3
# The in-process Clean kernel re-check (trust-ir-build's CleanCic re-checker)
# is the same kind of hot path: the two-language ratchet target
# `two_language_b3` re-checks dozens of `clean_backend_tv` certificates and
# measured 370 s at opt-level 0. Same policy as above: the dependency is
# compiled the way it is deployed, and no proof or resource limit changes.
[profile.dev.package.clean-kernel]
opt-level = 3
# The same for the Clean elaborator stack `clean-verify` (a trust-ir-build
# dev-dependency) pulls in: the replay tests (core_execution_*_replay,
# island_theorem, certificate_binding, two_language_b3, the trust-ir-build lib
# tests) spend nearly all of their time elaborating Clean's eval-IR prelude
# spec in clean-elab / clean-macro / clean-parser.
[profile.dev.package.clean-verify]
opt-level = 3
[profile.dev.package.clean-elab]
opt-level = 3
[profile.dev.package.clean-macro]
opt-level = 3
[profile.dev.package.clean-parser]
opt-level = 3
[profile.dev.package.clean-auto]
opt-level = 3
[profile.dev.package.clean-compiler]
opt-level = 3
[profile.dev.package.clean-olean]
opt-level = 3
[profile.dev.package.clean-runtime]
opt-level = 3
# The kernel's hot path also runs through its hashing and stack-probing
# dependencies, which opt-level 0 left unoptimized: sampled 2026-10-14 (macOS
# `sample`, 8 s of core_execution_u64_add), ahash 10.5%, hashbrown 10.1% and
# stacker 6.6% of the self time, with psm's stack probe beside them. Same
# policy: compiled the way they are deployed; the dev profile's overflow
# checks and debug assertions still apply, and no proof or resource limit
# changes.
[profile.dev.package.ahash]
opt-level = 3
[profile.dev.package.hashbrown]
opt-level = 3
[profile.dev.package.stacker]
opt-level = 3
[profile.dev.package.psm]
opt-level = 3

[workspace.metadata.atpkg]
# The binaries atpkg shims onto PATH when `trust-ir` is installed. The *-fixture bins are
# internal test fixtures, not user commands.
expose = ["trust-ir", "trust-ir-diff", "trust-ir-fmt"]

# Trust: policy for `targo trust` over this workspace.
[trust]
# No budget key: Trust retired `function_budget_ms` (its DECISION_QUEUE
# BUDGET-1a; a targo that carries the retirement refuses the key here), so a
# `targo trust` run of this workspace uses the toolchain's builtin clocks.
